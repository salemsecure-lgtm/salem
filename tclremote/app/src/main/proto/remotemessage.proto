// Android TV Remote v2 control protocol (port 6466).
syntax = "proto3";

option java_package = "com.salem.tclremote.remote";
option java_outer_classname = "RemoteProto";

message RemoteMessage {
  RemoteConfigure remote_configure = 1;
  RemoteSetActive remote_set_active = 2;
  RemoteError remote_error = 3;
  RemotePingRequest remote_ping_request = 4;
  RemotePingResponse remote_ping_response = 5;
  RemoteKeyInject remote_key_inject = 8;
  RemoteStart remote_start = 40;
}

enum RemoteDirection {
  UNKNOWN_DIRECTION = 0;
  START_LONG = 1;
  END_LONG = 2;
  SHORT = 3;
}

message RemoteDeviceInfo {
  string model = 1;
  string vendor = 2;
  int32 unknown1 = 3;
  string unknown2 = 4;
  string package_name = 5;
  string app_version = 6;
}

message RemoteConfigure {
  int32 code1 = 1;
  RemoteDeviceInfo device_info = 2;
}

message RemoteSetActive {
  int32 active = 1;
}

message RemoteError {
  bool value = 1;
  RemoteMessage message = 2;
}

message RemotePingRequest {
  int32 val1 = 1;
  int32 val2 = 2;
}

message RemotePingResponse {
  int32 val1 = 1;
}

message RemoteStart {
  bool started = 1;
}

// Android KeyEvent codes are written directly on the wire via the int value.
message RemoteKeyInject {
  int32 key_code = 1;
  RemoteDirection direction = 2;
}
