# Shared detekt config for all Salem Lift modules (extends detekt defaults).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreDefaultParameters: true # Rule-table rows default their "don't care" dimensions.

style:
  MagicNumber:
    active: false # Domain defaults (landmark seeds, RIR schedules) are named tables, not magic.
  ReturnCount:
    active: false
