<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON DASH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060f; touch-action:none; }
  #game { display:block; width:100vw; height:100vh; }
  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#eaf6ff; font-family:-apple-system, "Segoe UI", Roboto, system-ui, sans-serif; text-align:center;
    pointer-events:none; z-index:10;
  }
  .hidden { display:none !important; }
  .title {
    font-size:clamp(38px, 13vw, 96px); font-weight:900; letter-spacing:4px;
    background:linear-gradient(90deg,#00f0ff,#7a5cff,#ff3cac); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(122,92,255,.35); margin-bottom:6px;
  }
  .sub { font-size:clamp(13px,3.6vw,18px); opacity:.75; letter-spacing:2px; margin-bottom:30px; }
  .btn {
    pointer-events:auto; cursor:pointer; margin-top:18px;
    padding:16px 42px; border-radius:40px; font-size:clamp(16px,4.6vw,22px); font-weight:800; letter-spacing:2px;
    color:#05060f; background:linear-gradient(90deg,#00f0ff,#7a5cff); border:none;
    box-shadow:0 0 28px rgba(0,240,255,.45); transition:transform .08s ease;
  }
  .btn:active { transform:scale(.94); }
  .pill { font-size:clamp(13px,3.4vw,16px); opacity:.85; letter-spacing:1px; margin:4px 0; }
  .big { font-size:clamp(54px,18vw,140px); font-weight:900; line-height:1; }
  .gold { color:#ffd34d; text-shadow:0 0 22px rgba(255,211,77,.5); }
  .hint { font-size:clamp(12px,3.2vw,15px); opacity:.6; letter-spacing:1px; margin-top:26px; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.85} }
  .newbest { color:#ff3cac; font-weight:900; letter-spacing:3px; text-shadow:0 0 18px rgba(255,60,172,.6); animation:pop .5s ease; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .row { display:flex; gap:30px; margin:14px 0 4px; }
  .stat { display:flex; flex-direction:column; align-items:center; }
  .stat .v { font-size:clamp(26px,8vw,46px); font-weight:900; }
  .stat .k { font-size:11px; letter-spacing:2px; opacity:.55; margin-top:2px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- START -->
<div id="startScreen" class="overlay">
  <div class="title">NEON DASH</div>
  <div class="sub">GRAVITY RUNNER</div>
  <div class="pill">BEST &nbsp;<span id="startBest" class="gold">0</span></div>
  <button class="btn" id="startBtn">TAP TO PLAY</button>
  <div class="hint">TAP / SPACE to flip gravity &nbsp;•&nbsp; dodge spikes &nbsp;•&nbsp; grab orbs</div>
</div>

<!-- GAME OVER -->
<div id="overScreen" class="overlay hidden">
  <div id="newBest" class="newbest hidden">NEW BEST!</div>
  <div class="big gold" id="finalScore">0</div>
  <div class="pill">SCORE</div>
  <div class="row">
    <div class="stat"><div class="v" id="finalBest">0</div><div class="k">BEST</div></div>
    <div class="stat"><div class="v" id="finalOrbs">0</div><div class="k">ORBS</div></div>
    <div class="stat"><div class="v" id="finalMult">x1</div><div class="k">MAX COMBO</div></div>
  </div>
  <button class="btn" id="retryBtn">PLAY AGAIN</button>
  <div class="hint">TAP anywhere to retry</div>
</div>

<script>
(function(){
"use strict";

// ---------- Canvas / DPI ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Storage ----------
const KEY = 'neondash_best_v1';
function getBest(){ return parseInt(localStorage.getItem(KEY) || '0', 10) || 0; }
function setBest(v){ try{ localStorage.setItem(KEY, String(v)); }catch(e){} }

// ---------- Audio (WebAudio, offline) ----------
let AC = null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  return AC;
}
function blip(freq, dur, type, vol){
  const ac = audio(); if(!ac) return;
  if(ac.state === 'suspended') ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.value = 0.0001;
  g.gain.exponentialRampToValueAtTime(vol||0.18, ac.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + (dur||0.12));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (dur||0.12));
}
function sFlip(){ blip(540, 0.08, 'triangle', 0.12); }
function sOrb(combo){ blip(660 + combo*40, 0.10, 'square', 0.14); blip(990 + combo*40, 0.07, 'sine', 0.08); }
function sCrash(){ const ac=audio(); if(!ac) return; if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(220, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, ac.currentTime+0.4);
  g.gain.setValueAtTime(0.22, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.45);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.45);
}
function sMilestone(){ blip(880,0.1,'square',0.12); setTimeout(()=>blip(1175,0.12,'square',0.12),90); }

// ---------- Game state ----------
const STATE = { START:0, PLAY:1, DEAD:2 };
let state = STATE.START;

const PLAYER_X = () => W * 0.26;
const player = { y:0, vy:0, size:18, grav:1, trail:[] };
let speed = 0;          // horizontal world speed (px/s)
let baseSpeed = 360;
let dist = 0;           // distance score
let score = 0;
let orbs = 0;
let combo = 0;          // current combo
let maxCombo = 0;
let comboTimer = 0;
let obstacles = [];     // {x, top:bool, h, w, passed}
let collectibles = [];  // {x, y, r, got}
let particles = [];
let spawnX = 0;         // next spawn cursor in world units
let shake = 0;
let flash = 0;
let flashColor = 'rgba(255,60,172,';
let timeAlive = 0;
let lastMilestone = 0;
const GROUND = () => H * 0.92;
const CEIL = () => H * 0.08;

function reset(){
  player.y = GROUND() - player.size - 2;
  player.vy = 0; player.grav = 1; player.trail.length = 0;
  speed = baseSpeed;
  dist = 0; score = 0; orbs = 0; combo = 0; maxCombo = 0; comboTimer = 0;
  obstacles.length = 0; collectibles.length = 0; particles.length = 0;
  spawnX = W + 200; shake = 0; flash = 0; timeAlive = 0; lastMilestone = 0;
  prefillSpawn();
}

// Procedural generation -------------------------------------------------
let rngSeed = 1;
function rnd(){ rngSeed = (rngSeed*1103515245 + 12345) & 0x7fffffff; return rngSeed/0x7fffffff; }
function spawnChunk(){
  // gap between hazards shrinks subtly as speed grows
  const tier = Math.min(timeAlive/30, 1);          // 0..1 difficulty
  const gap = (340 - tier*120) + rnd()* (170 - tier*70);
  const r = rnd();
  if(r < 0.62){
    // spike on floor or ceiling
    const top = rnd() < 0.5;
    const h = 34 + rnd()*46 + tier*30;
    const w = 30 + rnd()*16;
    obstacles.push({ x:spawnX, top:top, h:h, w:w, passed:false });
    // sometimes pair an orb in the safe zone above/below
    if(rnd() < 0.55){
      const oy = top ? GROUND() - 40 - rnd()*60 : CEIL() + 40 + rnd()*60;
      collectibles.push({ x:spawnX + w*0.5, y:oy, r:10, got:false, t:rnd()*6 });
    }
  } else if(r < 0.8){
    // double pinch (floor + ceiling) with a gap to fly through — needs a flip
    const h1 = 30 + rnd()*40 + tier*22;
    const h2 = 30 + rnd()*40 + tier*22;
    obstacles.push({ x:spawnX, top:false, h:h1, w:34, passed:false });
    obstacles.push({ x:spawnX, top:true,  h:h2, w:34, passed:false });
    collectibles.push({ x:spawnX+17, y:(CEIL()+GROUND())/2, r:10, got:false, t:rnd()*6 });
  } else {
    // orb line (reward run)
    const n = 3 + Math.floor(rnd()*3);
    const base = CEIL() + 30 + rnd()*(GROUND()-CEIL()-60);
    for(let i=0;i<n;i++){
      collectibles.push({ x:spawnX + i*46, y:base + Math.sin(i*0.9)*30, r:10, got:false, t:rnd()*6 });
    }
  }
  spawnX += gap;
}
function prefillSpawn(){
  spawnX = W + 120;
  for(let i=0;i<6;i++) spawnChunk();
}

// ---------- Input ----------
function flip(){
  if(state === STATE.PLAY){
    player.grav *= -1;
    player.vy = player.grav * 40;     // little kick
    sFlip();
    for(let i=0;i<8;i++) addParticle(PLAYER_X(), player.y, '#00f0ff', 2);
  }
}
function tap(){
  if(state === STATE.START){ startGame(); return; }
  if(state === STATE.DEAD){ if(deadCooldown<=0){ startGame(); } return; }
  flip();
}
canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); tap(); }, {passive:false});
window.addEventListener('keydown', e=>{
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='Enter'){ e.preventDefault(); tap(); }
});
document.getElementById('startBtn').addEventListener('click', e=>{ e.stopPropagation(); startGame(); });
document.getElementById('retryBtn').addEventListener('click', e=>{ e.stopPropagation(); if(deadCooldown<=0) startGame(); });
// overlay-wide tap on death screen
document.getElementById('overScreen').addEventListener('pointerdown', e=>{ if(deadCooldown<=0) startGame(); });

// ---------- Particles ----------
function addParticle(x,y,color,scale){
  particles.push({
    x:x, y:y, vx:(rnd()-0.5)*220, vy:(rnd()-0.5)*220,
    life:0.5+rnd()*0.4, max:0.9, color:color, r:(2+rnd()*3)*(scale||1)
  });
}
function burst(x,y,color,n){ for(let i=0;i<n;i++) addParticle(x,y,color,1.4); }

// ---------- Screens ----------
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');
let deadCooldown = 0;

function startGame(){
  audio(); if(AC && AC.state==='suspended') AC.resume();
  rngSeed = (Date.now() & 0x7fffffff) || 1;
  reset();
  state = STATE.PLAY;
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
}
function gameOver(){
  state = STATE.DEAD;
  deadCooldown = 0.6;
  sCrash();
  shake = 26; flash = 1; flashColor = 'rgba(255,60,172,';
  burst(PLAYER_X(), player.y, '#ff3cac', 40);
  score = Math.floor(dist/10) + orbs*15;
  const best = getBest();
  const isBest = score > best;
  if(isBest) setBest(score);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = Math.max(best, score);
  document.getElementById('finalOrbs').textContent = orbs;
  document.getElementById('finalMult').textContent = 'x' + maxCombo;
  document.getElementById('newBest').classList.toggle('hidden', !isBest);
  overScreen.classList.remove('hidden');
}
document.getElementById('startBest').textContent = getBest();

// ---------- Update ----------
function update(dt){
  if(deadCooldown>0) deadCooldown -= dt;
  if(state !== STATE.PLAY){ updateParticles(dt); shake*=0.9; flash*=0.9; return; }

  timeAlive += dt;
  speed = baseSpeed + timeAlive*9;            // gradual ramp
  const dx = speed * dt;
  dist += dx;
  score = Math.floor(dist/10) + orbs*15;

  // milestone feedback every 500
  if(score - lastMilestone >= 500){ lastMilestone += 500; sMilestone(); flash=0.4; flashColor='rgba(0,240,255,'; }

  // physics
  const G = 2600;
  player.vy += player.grav * G * dt;
  player.y += player.vy * dt;
  const floorY = GROUND() - player.size;
  const ceilY = CEIL() + player.size;
  let landed = false;
  if(player.y >= floorY){ player.y = floorY; if(player.grav>0){ player.vy=0; landed=true; } else player.vy=0; }
  if(player.y <= ceilY){ player.y = ceilY; if(player.grav<0){ player.vy=0; landed=true; } else player.vy=0; }

  // trail
  player.trail.push({x:PLAYER_X(), y:player.y});
  if(player.trail.length>14) player.trail.shift();

  // combo decay
  if(comboTimer>0){ comboTimer -= dt; if(comboTimer<=0) combo=0; }

  // move world
  for(const o of obstacles){ o.x -= dx; }
  for(const c of collectibles){ c.x -= dx; c.t += dt; }
  // spawn more as needed
  spawnX -= dx;
  while(spawnX < W + 600) spawnChunk();
  // cull
  obstacles = obstacles.filter(o=> o.x + o.w > -40);
  collectibles = collectibles.filter(c=> c.x + c.r > -40 && !c.got);

  // collisions ---------------------------------------------------------
  const px = PLAYER_X(), ps = player.size;
  for(const o of obstacles){
    const ox = o.x, ow = o.w;
    // spike triangle bounding — treat as rect for fairness, slightly inset
    const oy = o.top ? CEIL() : GROUND() - o.h;
    const oh = o.h;
    if(px+ps*0.7 > ox+4 && px-ps*0.7 < ox+ow-4){
      if(o.top){ if(player.y - ps*0.7 < CEIL() + oh){ return gameOver(); } }
      else { if(player.y + ps*0.7 > GROUND() - oh){ return gameOver(); } }
    }
    // near miss flash
    if(!o.passed && o.x+ow < px){ o.passed = true; }
  }
  // orbs
  for(const c of collectibles){
    if(c.got) continue;
    const ddx = c.x - px, ddy = c.y - player.y;
    if(ddx*ddx + ddy*ddy < (c.r+ps)*(c.r+ps)){
      c.got = true; orbs++;
      combo++; if(combo>maxCombo) maxCombo=combo; comboTimer = 2.2;
      sOrb(Math.min(combo,8));
      burst(c.x, c.y, '#ffd34d', 14);
      flash = 0.18; flashColor = 'rgba(255,211,77,';
    }
  }

  updateParticles(dt);
  if(shake>0) shake *= 0.86;
  if(flash>0) flash *= 0.9;
}
function updateParticles(dt){
  for(const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 400*dt; p.life -= dt; }
  particles = particles.filter(p=>p.life>0);
}

// ---------- Render ----------
let bgOffset = 0;
function draw(){
  ctx.clearRect(0,0,W,H);
  // background gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#080a1c'); g.addColorStop(0.5,'#0b0720'); g.addColorStop(1,'#05060f');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.save();
  if(shake>0.3){ ctx.translate((rnd()-0.5)*shake, (rnd()-0.5)*shake); }

  // parallax grid
  bgOffset = (bgOffset + speed*0.18*(1/60)) % 60;
  ctx.strokeStyle = 'rgba(80,90,180,0.10)'; ctx.lineWidth = 1;
  for(let x = -((dist*0.3)%60); x < W; x += 60){
    ctx.beginPath(); ctx.moveTo(x, CEIL()); ctx.lineTo(x, GROUND()); ctx.stroke();
  }

  // ceiling & floor neon bars
  drawBar(CEIL(), true);
  drawBar(GROUND(), false);

  // collectibles
  for(const c of collectibles){
    if(c.got) continue;
    const pul = 1 + Math.sin(c.t*5)*0.15;
    ctx.save();
    ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r*pul, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(c.x - c.r*0.25, c.y - c.r*0.25, c.r*0.32, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // obstacles (spikes)
  for(const o of obstacles){
    drawSpike(o);
  }

  // particles
  for(const p of particles){
    const a = Math.max(0, p.life/p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // player trail
  for(let i=0;i<player.trail.length;i++){
    const t = player.trail[i]; const a = i/player.trail.length;
    ctx.globalAlpha = a*0.5;
    ctx.fillStyle = player.grav>0 ? '#00f0ff' : '#ff3cac';
    const s = player.size * a;
    ctx.fillRect(t.x - s/2, t.y - s/2, s, s);
  }
  ctx.globalAlpha = 1;

  // player
  if(state !== STATE.DEAD){
    const px = PLAYER_X();
    ctx.save();
    ctx.shadowColor = player.grav>0 ? '#00f0ff' : '#ff3cac';
    ctx.shadowBlur = 22;
    const grad = ctx.createLinearGradient(px-player.size, player.y, px+player.size, player.y);
    grad.addColorStop(0, player.grav>0 ? '#00f0ff' : '#ff3cac');
    grad.addColorStop(1, '#7a5cff');
    ctx.fillStyle = grad;
    roundRect(px-player.size, player.y-player.size, player.size*2, player.size*2, 6); ctx.fill();
    ctx.restore();
  }

  ctx.restore(); // shake

  // flash overlay
  if(flash>0.02){
    ctx.fillStyle = flashColor + (flash*0.4) + ')';
    ctx.fillRect(0,0,W,H);
  }

  // HUD
  if(state === STATE.PLAY){ drawHUD(); }
}
function drawBar(y, top){
  ctx.save();
  ctx.shadowColor = '#7a5cff'; ctx.shadowBlur = 16;
  ctx.fillStyle = 'rgba(122,92,255,0.9)';
  ctx.fillRect(0, top? y-4 : y, W, 4);
  ctx.restore();
}
function drawSpike(o){
  const ox = o.x, ow = o.w, oh = o.h;
  ctx.save();
  ctx.shadowColor = '#ff3cac'; ctx.shadowBlur = 14;
  const grd = ctx.createLinearGradient(0, o.top?CEIL():GROUND()-oh, 0, o.top?CEIL()+oh:GROUND());
  grd.addColorStop(0, '#ff3cac'); grd.addColorStop(1, '#7a5cff');
  ctx.fillStyle = grd;
  ctx.beginPath();
  if(o.top){
    ctx.moveTo(ox, CEIL()); ctx.lineTo(ox+ow, CEIL()); ctx.lineTo(ox+ow/2, CEIL()+oh);
  } else {
    ctx.moveTo(ox, GROUND()); ctx.lineTo(ox+ow, GROUND()); ctx.lineTo(ox+ow/2, GROUND()-oh);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawHUD(){
  ctx.fillStyle = '#eaf6ff';
  ctx.font = '900 ' + Math.round(Math.min(W*0.11, 54)) + 'px -apple-system, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.shadowColor = 'rgba(0,240,255,0.5)'; ctx.shadowBlur = 14;
  ctx.fillText(String(score), W/2, H*0.04);
  ctx.shadowBlur = 0;
  // combo
  if(combo>1){
    const a = Math.min(comboTimer/2.2, 1);
    ctx.globalAlpha = 0.6 + a*0.4;
    ctx.fillStyle = '#ffd34d';
    ctx.font = '900 ' + Math.round(Math.min(W*0.07,30)) + 'px system-ui, sans-serif';
    ctx.fillText('COMBO x' + combo, W/2, H*0.04 + Math.min(W*0.12,58));
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now){
  let dt = (now - last)/1000; last = now;
  if(dt > 0.05) dt = 0.05;   // clamp after tab pause
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// keep audio alive on resume
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && AC && AC.state==='suspended') AC.resume(); });

})();
</script>
</body>
</html>
